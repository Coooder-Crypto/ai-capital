services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-capital-postgres
    environment:
      POSTGRES_DB: ai_capital
      POSTGRES_USER: ai_capital
      POSTGRES_PASSWORD: ai_capital
    ports:
      - "55432:5432"
    volumes:
      - ai-capital-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_capital -d ai_capital"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ai-capital-postgres-data:
